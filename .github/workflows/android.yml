name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Download libv2ray.aar
        run: |
          mkdir -p app/libs
          curl -fsSL -L -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.8.20/libv2ray.aar"

      - name: Build playstore debug
        run: |
          chmod +x gradlew
          ./gradlew assemblePlaystoreDebug --stacktrace
